name: Build Lehre APK
on:
  push: { branches: [main] }
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          if [ -f Lehre-android.zip ]; then unzip -oq Lehre-android.zip -d src; else mkdir -p src && cp -r Lehre src/ 2>/dev/null || true; fi
          ls src/Lehre
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build
        working-directory: src/Lehre
        run: gradle assembleRelease --no-daemon
      - run: cp src/Lehre/app/build/outputs/apk/release/app-release.apk Lehre.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: "lehre-v1.${{ github.run_number }}"
          name: "Lehre v1.${{ github.run_number }}"
          body: ${{ toJSON(github.event.head_commit.message || 'New version') }}
          files: Lehre.apk
          make_latest: true
